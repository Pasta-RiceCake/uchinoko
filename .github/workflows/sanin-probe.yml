name: sanin-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: osm
        run: |
          q='[out:json][timeout:300];area["ISO3166-1"="JP"]->.jp;(nwr["amenity"~"kindergarten|childcare"](area.jp););out center tags;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            curl -sS -m 600 -A "uchinoko-techo/1.0 (data probe)" --data-urlencode "data=$q" $u -o osm.json || true; ls -la osm.json; head -c 300 osm.json; echo
            python3 -c "import json;json.load(open('osm.json'))" && break
          done
          python3 - <<'PY'
          import json,collections
          d=json.load(open('osm.json'))['elements'];print('total',len(d))
          n=[e.get('tags',{}).get('name','') for e in d]
          print('hoiku',sum('保育' in x for x in n),'kodomoen',sum('こども園' in x for x in n),'youchien',sum('幼稚園' in x for x in n),'noname',sum(not x for x in n))
          addr=collections.Counter(e['tags'].get('addr:city') or e['tags'].get('addr:province','?') for e in d);print(addr.most_common(15))
          # 地域別（緯度経度の箱）
          box={'世田谷区':(35.60,35.68,139.58,139.69),'札幌市中心':(43.0,43.1,141.3,141.4),'福岡市':(33.5,33.65,130.3,130.45),'松本市':(36.18,36.28,137.9,138.02)}
          for k,(a,b,c,dd) in box.items():
            xs=[e for e in d if a<=(e.get('lat') or e.get('center',{}).get('lat',0))<=b and c<=(e.get('lon') or e.get('center',{}).get('lon',0))<=dd]
            print(k,len(xs),[x['tags'].get('name') for x in xs[:6]])
          PY
