name: odk
on:
  workflow_dispatch:
    inputs:
      pref:
        description: "1つの都道府県だけ読む（例：岡山県）。空なら古い順に"
        default: ""
  schedule:
    - cron: "15 8 * * *"
permissions:
  contents: write
concurrency: ${{ github.workflow }}
jobs:
  odk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREF: ${{ github.event.inputs.pref }}
          MAX_PREFS: "12"
        run: python3 tools/build_odk.py
      - name: commit
        run: |
          git config user.name "uchinoko-data"
          git config user.email "uchinoko-data@users.noreply.github.com"
          [ -d public/data/odk ] || exit 0
          git add public/data/odk
          git diff --cached --quiet && exit 0
          git commit -m "子連れおでかけのイベントを更新"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep $((i*7)); done
