name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: site
        run: |
          set +e
          for u in / /senpai/ /city/c/14100/ /a/ /robots.txt /sitemap.xml; do echo "== $u"; curl -s -o /tmp/o -w '%{http_code}\n' "https://uchinoko.pocket-app.workers.dev$u"; grep -o 'google-site-verification[^>]*\|<title>[^<]*' /tmp/o | head -3; head -c 300 /tmp/o | grep -v '^<' ; echo; done; grep -o 'mntab\|vHayami\|SEO_PAGES' /tmp/o | sort | uniq -c
          curl -s -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" -o /tmp/g -w 'googlebot %{http_code}\n' https://uchinoko.pocket-app.workers.dev/; grep -c google-site-verification /tmp/g || true
      - name: og
        run: |
          set +e
          for u in "https://twitter.com/Interior/status/507185938620219395" "https://www.youtube.com/watch?v=dQw4w9WgXcQ" "https://www.tiktok.com/@scout2015/video/6718335390845095173" "https://www.instagram.com/instagram/" "https://www.threads.net/@instagram"; do echo "== $u"; curl -s "https://uchinoko.pocket-app.workers.dev/api/og?u=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$u")" | python3 -c 'import sys,json;j=json.load(sys.stdin);print(j.get("t"),"|",(j.get("n") or "")[:120],"| img",len(j.get("img") or ""))'; done
      - name: mhlw
        run: |
          set +e
          I=https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/kekkaku-kansenshou/yobou-sesshu/index.html
          curl -sL -A "Mozilla/5.0" -o /tmp/i -w 'index %{http_code}\n' $I
          python3 - <<'P'
          import re
          h=open('/tmp/i',encoding='utf-8',errors='replace').read()
          for m in re.finditer(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',h,re.S):
            t=re.sub(r'<[^>]+>','',m.group(2)).strip()
            if re.search(r'RS|百日|定期|スケジュール|妊|子ども|乳幼児|ワクチン',t): print(m.group(1),'|',t[:60])
          P
      - name: checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '.check_runs[] | [.name,.status,.conclusion,.completed_at,.output.summary] | @tsv' || true
          gh api repos/${{ github.repository }}/commits/6e2dbe2/check-runs --jq '.check_runs[] | [.name,.status,.conclusion,.completed_at,(.output.summary//"")[0:300]] | @tsv' || true
          gh api repos/${{ github.repository }}/commits/6e2dbe2/statuses --jq '.[] | [.context,.state,.description] | @tsv' || true
