name: data-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: catalog
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,collections
          def get(u):
            r=urllib.request.Request(u,headers={'User-Agent':'uchinoko-techo/1.0'});return json.load(urllib.request.urlopen(r,timeout=60))
          for base in ['https://data.e-gov.go.jp/data/api/action/package_search','https://www.data.go.jp/data/api/action/package_search']:
            try:
              for q in ['イベント一覧','子育て施設一覧','保育施設']:
                d=get(base+'?'+urllib.parse.urlencode({'q':q,'rows':1000}))
                res=d['result'];print(base,q,'count',res['count'])
                orgs=collections.Counter((p.get('organization') or {}).get('title','?') for p in res['results'])
                print(' orgs',len(orgs),list(orgs)[:40])
                fmts=collections.Counter(r.get('format','') for p in res['results'] for r in p.get('resources',[]));print(' fmts',fmts.most_common(6))
                for p in res['results'][:3]:
                  print(' ex',p['title'],[(r.get('format'),r.get('url')) for r in p.get('resources',[])][:2])
              break
            except Exception as e: print('ERR',base,e)
          PY
      - name: wikidata
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          q='SELECT ?code ?label ?site WHERE { ?c wdt:P429 ?code; wdt:P856 ?site; rdfs:label ?label FILTER(lang(?label)="ja") } '
          u='https://query.wikidata.org/sparql?'+urllib.parse.urlencode({'query':q,'format':'json'})
          d=json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'uchinoko-techo/1.0'}),timeout=120))
          b=d['results']['bindings'];print('rows',len(b))
          for x in b:
            if x['label']['value'] in ('倉敷市','横浜市','世田谷区','松本市'): print(x['code']['value'],x['label']['value'],x['site']['value'])
          PY
